name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test-and-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test
        run: dotnet test NuvLoc.slnx --configuration Release
      - name: Pack
        run: dotnet pack src/NuvyntraLabs.NuvLoc.Cli/NuvyntraLabs.NuvLoc.Cli.csproj --configuration Release --output artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: NuvLoc-NuGet
          path: artifacts/*.nupkg

      # Pipeline-only publish. Never push from a local clone.
      # secrets cannot be used in if:; check the key in the script instead.
      - name: Push nuget.org
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          NUGET_KEY_NUVLOC: ${{ secrets.NUGET_KEY_NUVLOC }}
        run: |
          if [ -z "${NUGET_KEY_NUVLOC:-}" ]; then
            echo "No NUGET_KEY_NUVLOC; skip nuget.org push."
            exit 0
          fi
          dotnet nuget push artifacts/*.nupkg --api-key "$NUGET_KEY_NUVLOC" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Push GitHub Packages
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          dotnet nuget push artifacts/*.nupkg --api-key "${{ secrets.GITHUB_TOKEN }}" --source "https://nuget.pkg.github.com/nuvyntralabs/index.json" --skip-duplicate
        continue-on-error: true
